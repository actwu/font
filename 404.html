    };

    const normalChars = [...fonts.normal];

    const convert = (text, type) => {
      const map = [...fonts[type]];
      return [...text].map(c => {
        const i = normalChars.indexOf(c);
        return i >= 0 ? map[i] : c;
      }).join('');
    };

    const t = document.getElementById("t");
    const pathParts = location.pathname.split("/").filter(p => p);
    const type = pathParts[1] || "normal"; 
    const raw = decodeURIComponent(pathParts[2] || "404 Content");

    const converted = fonts[type] ? convert(raw, type) : raw;
    t.textContent = converted;

    navigator.clipboard.writeText(converted);

    t.onclick = () => navigator.clipboard.writeText(t.textContent);
