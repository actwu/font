    clear: [..."𝖺𝖻𝖼𝖽𝖾𝖿𝗀𝗁𝗂𝗃𝗄𝗅𝗆𝗇𝗈𝗉𝗊𝗋𝗌𝗍𝗎𝗏𝗐𝗑𝗒𝗓𝖠𝖡𝖢𝖣𝖤𝖥𝖦𝖧𝖨𝖩𝖪𝖫𝖬𝖭𝖮𝖯𝖰𝖱𝖲𝖳𝖴𝖵𝖶𝖷𝖸𝖹%&.𝟢𝟣𝟤𝟥𝟦𝟧𝟨𝟩𝟪𝟫_>"],
    bolditalic: [..."𝙖𝙗𝙘𝙙𝙚𝙛𝙜𝙝𝙞𝙟𝙠𝙡𝙢𝙣𝙤𝙥𝙦𝙧𝙨𝙩𝙪𝙫𝙬𝙭𝙮𝙯𝘼𝘽𝘾𝘿𝙀𝙁𝙂𝙃𝙄𝙅𝙆𝙇𝙈𝙉𝙊𝙋𝙌𝙍𝙎𝙏𝙐𝙑𝙒𝙓𝙔𝙕%&.𝟎𝟏𝟐𝟑𝟒𝟓𝟔𝟕𝟖𝟗_>"],
    italic: [..."𝘢𝘣𝘤𝘥𝘦𝘧𝘨𝘩𝘪𝘫𝘬𝘭𝘮𝘯𝘰𝘱𝘲𝘳𝘴𝘵𝘶𝘷𝘸𝘹𝘺𝘻𝘈𝘉𝘊𝘋𝘌𝘍𝘎𝘏𝘐𝘑𝘒𝘓𝘔𝘕𝘖𝘗𝘘𝘙𝘚𝘛𝘜𝘝𝘞𝘟𝘠𝘡%&.0123456789_>"],
    bold: [..."𝗮𝗯𝗰𝗱𝗲𝗳𝗴𝗵𝗶𝗷𝗸𝗹𝗺𝗻𝗼𝗽𝗾𝗿𝘀𝘁𝘂𝘃𝘄𝘅𝘆𝘇𝗔𝗕𝗖𝗗𝗘𝗙𝗚𝗛𝗜𝗝𝗞𝗟𝗠𝗡𝗢𝗣𝗤𝗥𝗦𝗧𝗨𝗩𝗪𝗫𝗬𝗭%&.𝟬𝟭𝟮𝟯𝟰𝟱𝟲𝟳𝟴𝟵_>"],
    roman: [..."𝐚𝐛𝐜𝐝𝐞𝐟𝐠𝐡𝐢𝐣𝐤𝐥𝐦𝐧𝐨𝐩𝐪𝐫𝐬𝐭𝐮𝐯𝐰𝐱𝐲𝐳𝐀𝐁𝐂𝐃𝐄𝐅𝐆𝐇𝐈𝐉𝐊𝐋𝐌𝐍𝐎𝐏𝐐𝐑𝐒𝐓𝐔𝐕𝐖𝐗𝐘𝐙%&.𝟎𝟏𝟐𝟑𝟒𝟓𝟔𝟕𝟖𝟗_>"]
    };

    const normalChars = [...fonts.normal];

    const convert = (text, type) => {
      const map = [...fonts[type]];
      return [...text].map(c => {
        const i = normalChars.indexOf(c);
        return i >= 0 ? map[i] : c;
      }).join('');
    };

    const t = document.getElementById("t");
    const pathParts = location.pathname.split("/").filter(p => p);
    const type = pathParts[1] || "normal"; 
    const raw = decodeURIComponent(pathParts[2] || "404 Content");

    const converted = fonts[type] ? convert(raw, type) : raw;
    t.textContent = converted;

    navigator.clipboard.writeText(converted);

    t.onclick = () => navigator.clipboard.writeText(t.textContent);
  </script>
