<body>
<h1 id="t"></h1>

<script>
const t = document.getElementById("t");

const normal = [..."abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 "];
const italic = [..."𝘢𝘣𝘤𝘥𝘦𝘧𝘨𝘩𝘪𝘫𝘬𝘭𝘮𝘯𝘰𝘱𝘲𝘳𝘴𝘵𝘶𝘷𝘸𝘹𝘺𝘻𝘈𝘉𝘊𝘋𝘌𝘍𝘎𝘏𝘐𝘑𝘒𝘓𝘔𝘕𝘖𝘗𝘘𝘙𝘚𝘛𝘜𝘝𝘞𝘟𝘠𝘡0123456789 "];
const bold = [..."𝗮𝗯𝗰𝗱𝗲𝗳𝗴𝗵𝗶𝗷𝗸𝗹𝗺𝗻𝗼𝗽𝗾𝗿𝘀𝘁𝘶𝘃𝘄𝘅𝘆𝘇𝗔𝗕𝗖𝗗𝗘𝗙𝗚𝗛𝗜𝗝𝗞𝗟𝗠𝗡𝗢𝗣𝗤𝗥𝗦𝗧𝗨𝗩𝗪𝗫𝗬𝗭0123456789 "];

const convert = (text, map)=> {
  return [...text].map(c=>{
    let i = normal.indexOf(c);
    return i >= 0 ? map[i] : c;
  }).join("");
};

const run = ()=> {
  const raw = decodeURIComponent(location.pathname.split("/").pop());
  let mode = "normal";

  if(location.pathname.includes("/italic/")) mode = "italic";
  if(location.pathname.includes("/bold/")) mode = "bold";

  let out = raw;
  if(mode === "italic") out = convert(raw, italic);
  if(mode === "bold") out = convert(raw, bold);

  t.textContent = out;
  navigator.clipboard.writeText(out);
};

t.onclick = ()=>navigator.clipboard.writeText(t.textContent);

run();
</script>
